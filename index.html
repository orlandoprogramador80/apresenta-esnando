<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideAI - Gerador Tecnológico de Aulas</title>
    <style>
        /* Paleta de Cores: Petróleo, Azul Noturno e Neon */
        :root {
            --bg-deep-oil: #0a0f1d;
            --bg-card: rgba(16, 24, 48, 0.7);
            --electric-blue: #00d2ff;
            --tech-cyan: #00f5d4;
            --text-light: #e2e8f0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep-oil);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            background: rgba(10, 15, 29, 0.9);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--electric-blue);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
        }

        /* Campo de Input Estilo Tech */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            background: var(--bg-card);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 12px;
            font-size: 1rem;
        }

        button {
            background: linear-gradient(135deg, var(--electric-blue), var(--tech-cyan));
            border: none;
            padding: 12px 28px;
            color: #0a0f1d;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--electric-blue);
        }

        /* Container de Visualização do Slide */
        .slide-viewer {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            min-height: 400px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            position: relative;
            transition: all 0.5s ease;
        }

        .slide-title {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 20px;
            border-left: 5px solid var(--tech-cyan);
            padding-left: 15px;
        }

        .slide-content {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #94a3b8;
        }

        .slide-content ul {
            margin: 0;
            padding-left: 20px;
        }

        .slide-content li {
            margin-bottom: 12px;
        }

        /* Controles de Navegação */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: var(--electric-blue);
        }

        .btn-nav:hover {
            background: rgba(0, 210, 255, 0.1);
        }

        .status-loading {
            color: var(--tech-cyan);
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>SlideAI // Apresentações Acadêmicas</h1>
    </header>

    <div class="container">
        <div class="input-group">
            <input type="text" id="temaInput" placeholder="Digite o tema da aula (ex: Fisiologia Cardíaca, Introdução ao Git)...">
            <button onclick="gerarApresentacao()">Gerar Slides</button>
        </div>

        <div id="loading" class="status-loading">Conectando ao Gemini e moldando os slides...</div>

        <div class="slide-viewer" id="slideViewer">
            <div class="slide-title" id="tituloSlide">Pronto para começar</div>
            <div class="slide-content" id="conteudoSlide">
                Digite um tema acima para gerar sua aula tecnológica com Inteligência Artificial.
            </div>
        </div>

        <div class="controls" id="controles" style="display: none;">
            <button class="btn-nav" onclick="slideAnterior()">◀ Voltar</button>
            <span id="contadorSlide" style="align-self: center; font-weight: bold;">1 / 1</span>
            <button class="btn-nav" onclick="proximoSlide()">Avançar ▶</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
